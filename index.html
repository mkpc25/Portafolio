<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  :root{
    --font:'DM Sans',sans-serif;--mono:'DM Mono',monospace;
    --ink:#1a1a1a;--muted:#6b6b6b;--hint:#9b9b9b;
    --surface:#ffffff;--bg:#f7f7f5;
    --border:rgba(0,0,0,0.1);--border-md:rgba(0,0,0,0.18);
    --accent:#0C447C;--accent-light:#E6F1FB;--accent-text:#185FA5;
    --green-bg:#E1F5EE;--green-text:#0F6E56;
  }
  @media(prefers-color-scheme:dark){:root{
    --ink:#e8e6de;--muted:#9b9994;--hint:#6b6a65;
    --surface:#1e1e1c;--bg:#161614;
    --border:rgba(255,255,255,0.1);--border-md:rgba(255,255,255,0.18);
    --accent:#378ADD;--accent-light:#042C53;--accent-text:#85B7EB;
    --green-bg:#04342C;--green-text:#5DCAA5;
  }}
  body{font-family:var(--font);background:var(--bg);color:var(--ink);min-height:100vh;}
  .screen{display:none;}.screen.active{display:block;}
  .login-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:2rem;}
  .login-card{width:100%;max-width:400px;background:var(--surface);border:0.5px solid var(--border-md);border-radius:16px;padding:2.25rem 2.25rem 2rem;}
  .login-brand{display:flex;align-items:center;gap:10px;margin-bottom:2rem;}
  .login-brand-icon{width:38px;height:38px;background:var(--accent);border-radius:9px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px;}
  .login-brand-name{font-size:14px;font-weight:500;color:var(--ink);}
  .login-brand-sub{font-size:11px;color:var(--muted);}
  .login-h{font-size:20px;font-weight:500;color:var(--ink);margin-bottom:.4rem;}
  .login-sub{font-size:13px;color:var(--muted);margin-bottom:2rem;line-height:1.6;}
  .login-btn{width:100%;padding:11px;background:var(--accent);color:#fff;font-family:var(--font);font-size:14px;font-weight:500;border:none;border-radius:9px;cursor:pointer;transition:opacity .15s;}
  .login-btn:hover{opacity:.88;}
  .login-hint{font-size:11px;color:var(--hint);text-align:center;margin-top:1rem;}
  .app{max-width:900px;margin:0 auto;padding:0 1.5rem 3rem;}
  .nav{display:flex;justify-content:space-between;align-items:center;padding:1rem 0;border-bottom:0.5px solid var(--border);position:sticky;top:0;background:var(--bg);z-index:10;}
  .nav-brand{display:flex;align-items:center;gap:8px;}
  .nav-brand-icon{width:28px;height:28px;background:var(--accent);border-radius:6px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;}
  .nav-brand-name{font-size:13px;font-weight:500;color:var(--ink);}
  .nav-tabs{display:flex;gap:3px;}
  .nav-tab{padding:5px 13px;font-size:12px;font-family:var(--font);border:0.5px solid transparent;border-radius:8px;cursor:pointer;color:var(--muted);background:transparent;transition:all .15s;}
  .nav-tab:hover{background:var(--surface);color:var(--ink);}
  .nav-tab.active{background:var(--surface);color:var(--ink);border-color:var(--border-md);}
  .nav-right{display:flex;gap:8px;align-items:center;}
  .nav-badge{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:4px;}
  .nav-logout{font-size:11px;color:var(--muted);background:none;border:0.5px solid var(--border);border-radius:7px;padding:4px 10px;cursor:pointer;font-family:var(--font);}
  .nav-logout:hover{background:var(--surface);}
  .tab{display:none;padding-top:1.75rem;}.tab.active{display:block;}
  .sec-title{font-size:10px;font-weight:500;letter-spacing:.09em;text-transform:uppercase;color:var(--accent);margin-bottom:.9rem;padding-bottom:6px;border-bottom:0.5px solid var(--border);}
  .section{margin-bottom:1.75rem;}
  .cv-header{display:flex;justify-content:space-between;align-items:flex-start;padding-bottom:1.5rem;border-bottom:0.5px solid var(--border);margin-bottom:1.75rem;gap:1rem;flex-wrap:wrap;}
  .cv-name{font-size:22px;font-weight:500;color:var(--ink);line-height:1.2;}
  .cv-role{font-size:14px;color:var(--muted);margin-top:4px;}
  .cv-contact-item{display:flex;align-items:center;justify-content:flex-end;gap:5px;font-size:12px;color:var(--muted);margin-bottom:5px;}
  .cv-contact-item i{font-size:13px;color:var(--accent);}
  .resumen-text{font-size:13px;color:var(--muted);line-height:1.75;}
  .metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:1.75rem;}
  .metric{background:var(--surface);border-radius:10px;padding:.9rem 1rem;border:0.5px solid var(--border);}
  .metric-label{font-size:11px;color:var(--muted);margin-bottom:4px;}
  .metric-val{font-size:22px;font-weight:500;color:var(--ink);}
  .lang-item{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
  .lang-name{font-size:13px;color:var(--ink);}
  .lang-level{font-size:11px;color:var(--muted);background:var(--bg);padding:3px 8px;border-radius:20px;border:0.5px solid var(--border);}
  .exp-item{margin-bottom:1.25rem;padding-bottom:1.25rem;border-bottom:0.5px solid var(--border);}
  .exp-item:last-child{border-bottom:none;padding-bottom:0;}
  .exp-top{display:flex;justify-content:space-between;align-items:baseline;gap:.5rem;flex-wrap:wrap;}
  .exp-company{font-size:13px;font-weight:500;color:var(--ink);}
  .exp-period{font-size:11px;color:var(--hint);font-family:var(--mono);}
  .exp-role{font-size:12px;color:var(--accent-text);margin:2px 0 5px;font-weight:500;}
  .exp-desc{font-size:12px;color:var(--muted);line-height:1.65;}
  .form-item{margin-bottom:1rem;}
  .form-title{font-size:13px;font-weight:500;color:var(--ink);display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
  .form-inst{font-size:12px;color:var(--muted);}
  .form-year{font-size:11px;color:var(--hint);font-family:var(--mono);}
  .verified{display:inline-flex;align-items:center;gap:3px;font-size:10px;color:var(--green-text);background:var(--green-bg);padding:2px 7px;border-radius:20px;}
  .skills-tags{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:1.25rem;}
  .skill-tag{font-size:11px;color:var(--ink);background:var(--bg);border:0.5px solid var(--border);border-radius:20px;padding:4px 9px;}
  .skill-soft{background:var(--accent-light);color:var(--accent-text);border-color:transparent;}
  .titles-notice{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--muted);padding:.75rem 1rem;background:var(--accent-light);border-radius:10px;margin-bottom:1.5rem;}
  .titles-notice i{color:var(--accent);}
  .titles-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:1rem;}
  .title-card{background:var(--surface);border:0.5px solid var(--border-md);border-radius:14px;padding:1.1rem;transition:border-color .15s;}
  .title-card:hover{border-color:var(--accent);}
  .title-icon{font-size:22px;color:var(--accent);margin-bottom:8px;}
  .title-name{font-size:13px;font-weight:500;color:var(--ink);margin-bottom:3px;line-height:1.4;}
  .title-inst{font-size:11px;color:var(--muted);}
  .title-meta{display:flex;justify-content:space-between;align-items:center;margin-top:10px;}
  .title-year{font-size:11px;color:var(--hint);font-family:var(--mono);}
  .title-badge{font-size:10px;padding:3px 7px;background:var(--accent-light);color:var(--accent-text);border-radius:20px;}
  .title-btn{display:flex;align-items:center;justify-content:center;gap:5px;font-size:12px;color:var(--accent);background:var(--accent-light);border:none;border-radius:8px;padding:6px 10px;cursor:pointer;font-family:var(--font);margin-top:10px;width:100%;transition:opacity .15s;}
  .title-btn:hover{opacity:.8;}
  .title-btn:disabled{opacity:.4;cursor:default;}
  .pdf-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:999;align-items:center;justify-content:center;padding:1rem;}
  .pdf-overlay.open{display:flex;}
  .pdf-modal{background:var(--surface);border-radius:14px;width:100%;max-width:760px;max-height:90vh;border:0.5px solid var(--border-md);overflow:hidden;display:flex;flex-direction:column;}
  .pdf-mhead{display:flex;justify-content:space-between;align-items:center;padding:13px 16px;border-bottom:0.5px solid var(--border);}
  .pdf-mtitle{font-size:13px;font-weight:500;color:var(--ink);display:flex;align-items:center;gap:7px;}
  .pdf-close{width:26px;height:26px;border:0.5px solid var(--border-md);border-radius:6px;background:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--muted);}
  .pdf-close:hover{background:var(--bg);}
  .pdf-frame{flex:1;min-height:500px;border:none;background:var(--bg);}
  .pdf-nourl{padding:2.5rem;text-align:center;color:var(--muted);font-size:13px;line-height:1.7;}
  .pdf-nourl i{font-size:32px;color:var(--accent);display:block;margin-bottom:.75rem;}
  .pdf-badge-wrap{padding:.5rem 1rem .75rem;text-align:center;}
  .pdf-badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--accent-text);background:var(--accent-light);padding:4px 10px;border-radius:20px;}
  @media(max-width:600px){.nav-tabs{display:none;}.cv-header{flex-direction:column;}.cv-contact-item{justify-content:flex-start;}}
</style>
</head>

</div>

<div class="pdf-overlay" id="pdf-overlay">
  <div class="pdf-modal">
    <div class="pdf-mhead">
      <div class="pdf-mtitle">
        <i class="ti ti-file-type-pdf" style="color:var(--accent);font-size:17px"></i>
        <span id="pdf-modal-name"></span>
      </div>
      <button class="pdf-close" onclick="closePdf()"><i class="ti ti-x"></i></button>
    </div>
    <div id="pdf-modal-body"></div>
  </div>
</div>

<script>
function renderPerfil() {
  const p = DATOS.perfil;
  const numCert = DATOS.formacion.filter(f => f.tipo === 'certificacion').length;
  document.getElementById('tab-perfil').innerHTML = `
    <div class="cv-header">
      <div>
        <div class="cv-name">${p.nombre}</div>
        <div class="cv-role">${p.rol}</div>
      </div>
      <div>
        <div class="cv-contact-item"><i class="ti ti-mail"></i> ${p.email}</div>
        <div class="cv-contact-item"><i class="ti ti-phone"></i> ${p.telefono}</div>
        <div class="cv-contact-item"><i class="ti ti-map-pin"></i> ${p.ubicacion}</div>
        <div class="cv-contact-item"><i class="ti ti-calendar"></i> ${p.fecha_nacimiento}</div>
      </div>
    </div>
    <div class="section">
      <div class="sec-title">Resumen profesional</div>
      <p class="resumen-text">${p.resumen}</p>
    </div>
    <div class="section">
      <div class="sec-title">Datos clave</div>
      <div class="metrics">
        <div class="metric"><div class="metric-label">Años de experiencia</div><div class="metric-val">+15</div></div>
        <div class="metric"><div class="metric-label">Empresas / Organizaciones</div><div class="metric-val">${DATOS.experiencia.length}</div></div>
        <div class="metric"><div class="metric-label">Certificaciones y cursos</div><div class="metric-val">${numCert}</div></div>
        <div class="metric"><div class="metric-label">Idiomas</div><div class="metric-val">ES · EN</div></div>
      </div>
    </div>
    <div class="section">
      <div class="sec-title">Idiomas</div>
      <div class="lang-item"><div class="lang-name">${p.idioma_1}</div><div class="lang-level">${p.nivel_1}</div></div>
      <div class="lang-item"><div class="lang-name">${p.idioma_2}</div><div class="lang-level">${p.nivel_2}</div></div>
    </div>`;
}

function renderExperiencia() {
  document.getElementById('tab-experiencia').innerHTML =
    `<div class="sec-title">Historial laboral</div>` +
    DATOS.experiencia.map(e => `
      <div class="exp-item">
        <div class="exp-top">
          <div class="exp-company">${e.empresa}</div>
          <div class="exp-period">${e.periodo}</div>
        </div>
        <div class="exp-role">${e.cargo}</div>
        <div class="exp-desc">${e.descripcion}</div>
      </div>`).join('');
}

function renderFormacion() {
  const item = f => `
    <div class="form-item">
      <div class="form-title">${f.titulo} <span class="verified"><i class="ti ti-circle-check" style="font-size:10px"></i> Verificado</span></div>
      <div class="form-inst">${f.institucion}</div>
      <div class="form-year">${f.anio}</div>
    </div>`;
  const edu  = DATOS.formacion.filter(f => f.tipo === 'educacion');
  const cert = DATOS.formacion.filter(f => f.tipo === 'certificacion');
  document.getElementById('tab-formacion').innerHTML = `
    <div class="section"><div class="sec-title">Educación reglada</div>${edu.map(item).join('')}</div>
    <div class="section"><div class="sec-title">Certificaciones y cursos</div>${cert.map(item).join('')}</div>`;
}

function renderAptitudes() {
  const tags = (arr, soft) => arr.map(a =>
    `<span class="skill-tag${soft?' skill-soft':''}">${a.aptitud}</span>`).join('');
  const tec = DATOS.aptitudes.filter(a => a.categoria === 'tecnica');
  const ges = DATOS.aptitudes.filter(a => a.categoria === 'gestion');
  const per = DATOS.aptitudes.filter(a => a.categoria === 'personal');
  document.getElementById('tab-aptitudes').innerHTML = `
    <div class="section"><div class="sec-title">Competencias técnicas</div><div class="skills-tags">${tags(tec,false)}</div></div>
    <div class="section"><div class="sec-title">Habilidades de gestión</div><div class="skills-tags">${tags(ges,true)}</div></div>
    <div class="section"><div class="sec-title">Habilidades personales</div><div class="skills-tags">${tags(per,true)}</div></div>`;
}

function getIcon(t) {
  const n = t.nombre.toLowerCase();
  if (t.tipo === 'Título oficial') return 'ti-school';
  if (n.includes('english') || n.includes('inglés')) return 'ti-language';
  if (n.includes('cloud')) return 'ti-cloud';
  if (n.includes('ia') || n.includes('gemini') || n.includes('prompting')) return 'ti-brain';
  if (n.includes('proyecto') || n.includes('agile')) return 'ti-chart-gantt';
  if (n.includes('administrat')) return 'ti-building';
  return 'ti-certificate';
}

function toPdfEmbed(url) {
  if (!url) return '';
  const m = url.match(/\/d\/([a-zA-Z0-9_-]+)/);
  return m ? `https://drive.google.com/file/d/${m[1]}/preview` : url;
}

function renderTitulos() {
  const cards = DATOS.titulos.map(t => {
    const hasUrl = (t.url_pdf || '').trim() !== '';
    const embed  = toPdfEmbed(t.url_pdf || '');
    const sn = t.nombre.replace(/'/g, "\\'");
    const su = embed.replace(/'/g, "\\'");
    return `
    <div class="title-card">
      <div class="title-icon"><i class="ti ${getIcon(t)}"></i></div>
      <div class="title-name">${t.nombre}</div>
      <div class="title-inst">${t.institucion}</div>
      <div class="title-meta">
        <div class="title-year">${t.anio}</div>
        <div class="title-badge">${t.tipo}</div>
      </div>
      <button class="title-btn" ${hasUrl ? '' : 'disabled'}
        ${hasUrl ? `onclick="openPdf('${sn}','${su}')"` : ''}>
        <i class="ti ${hasUrl ? 'ti-eye' : 'ti-clock'}"></i>
        ${hasUrl ? 'Ver documento' : 'PDF pendiente'}
      </button>
    </div>`;
  }).join('');
  document.getElementById('tab-titulos').innerHTML = `
    <div class="titles-notice"><i class="ti ti-shield-check"></i> Documentos en modo solo lectura. No es posible descargar ni modificar los archivos.</div>
    <div class="titles-grid">${cards}</div>`;
}

function enterPortfolio() {
  document.getElementById('screen-login').classList.remove('active');
  document.getElementById('screen-cv').classList.add('active');
  renderPerfil();
  renderExperiencia();
  renderFormacion();
  renderAptitudes();
  renderTitulos();
}

function logout() {
  document.getElementById('screen-cv').classList.remove('active');
  document.getElementById('screen-login').classList.add('active');
}

function switchTab(tab, el) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
  document.getElementById('tab-' + tab).classList.add('active');
  if (el) el.classList.add('active');
}

function openPdf(name, embedUrl) {
  document.getElementById('pdf-modal-name').textContent = name;
  document.getElementById('pdf-modal-body').innerHTML = embedUrl
    ? `<iframe class="pdf-frame" src="${embedUrl}" allowfullscreen></iframe>
       <div class="pdf-badge-wrap"><span class="pdf-badge"><i class="ti ti-shield-lock" style="font-size:11px"></i> Visualización protegida · Solo lectura</span></div>`
    : `<div class="pdf-nourl"><i class="ti ti-file-off"></i>Este documento aún no tiene PDF vinculado.</div>`;
  document.getElementById('pdf-overlay').classList.add('open');
}

function closePdf() {
  document.getElementById('pdf-overlay').classList.remove('open');
  document.getElementById('pdf-modal-body').innerHTML = '';
}

document.getElementById('pdf-overlay').addEventListener('click', function(e) {
  if (e.target === this) closePdf();
});
</script>
</body>
</html>
